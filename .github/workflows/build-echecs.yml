name: Build APK Echecs Strategie

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer le SDK Android et Gradle
        run: |
          echo "SDK : $ANDROID_HOME"
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-34" "build-tools;34.0.0" > /dev/null
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d $HOME/gradle
          echo "$HOME/gradle/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Créer le projet Android
        run: |
          set -e
          mkdir -p app/src/main/java/com/echecs/strategie app/src/main/assets app/src/main/res/drawable app/src/main/res/drawable-anydpi-v26
          cat > settings.gradle << 'EOF_0'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "EchecsStrategie"
          include ':app'
          EOF_0
          cat > build.gradle << 'EOF_1'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_1
          cat > gradle.properties << 'EOF_2'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=false
          EOF_2
          cat > app/build.gradle << 'EOF_3'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.echecs.strategie'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.echecs.strategie'
                  minSdk 21
                  targetSdk 34
                  versionCode 5
                  versionName '3.2'
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_3
          cat > app/src/main/AndroidManifest.xml << 'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>
              <application
                  android:label="Échecs Stratégie"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_4
          cat > app/src/main/java/com/echecs/strategie/MainActivity.java << 'EOF_5'
          package com.echecs.strategie;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private WebView web;
              private TextToSpeech tts;
              private volatile boolean ttsOk = false;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(Color.parseColor("#14211b"));
                  getWindow().setNavigationBarColor(Color.parseColor("#0d1611"));
                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#14211b"));
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setTextZoom(100);
                  web.setWebViewClient(new WebViewClient());
                  web.addJavascriptInterface(new Bridge(), "AndroidTTS");
                  setContentView(web);
                  initTts();
                  web.loadUrl("file:///android_asset/index.html");
              }

              private void initTts() {
                  tts = new TextToSpeech(this, status -> {
                      if (status == TextToSpeech.SUCCESS && tts != null) {
                          int r = tts.setLanguage(Locale.FRANCE);
                          if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED) {
                              r = tts.setLanguage(Locale.FRENCH);
                          }
                          ttsOk = r != TextToSpeech.LANG_MISSING_DATA && r != TextToSpeech.LANG_NOT_SUPPORTED;
                          tts.setSpeechRate(0.95f);
                          tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                              @Override public void onStart(String id) { }
                              @Override public void onDone(String id) { done(id); }
                              @Override public void onError(String id) { done(id); }
                          });
                      }
                  });
              }

              private void done(final String id) {
                  if (id == null) return;
                  final String safe = id.replaceAll("[^A-Za-z0-9]", "");
                  runOnUiThread(() -> web.evaluateJavascript("window.ttsDone&&window.ttsDone('" + safe + "')", null));
              }

              class Bridge {
                  @JavascriptInterface
                  public void speak(String text, String id) {
                      if (tts != null && ttsOk) {
                          tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, id);
                      } else {
                          long d = Math.max(1500L, text.length() * 60L);
                          web.postDelayed(() -> done(id), d);
                      }
                  }

                  @JavascriptInterface
                  public void stop() {
                      if (tts != null) tts.stop();
                  }

                  @JavascriptInterface
                  public boolean ready() {
                      return ttsOk;
                  }

                  @JavascriptInterface
                  public void install() {
                      runOnUiThread(() -> {
                          try {
                              Intent i = new Intent(TextToSpeech.Engine.ACTION_INSTALL_TTS_DATA);
                              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(i);
                          } catch (Exception e) {
                              try {
                                  Intent j = new Intent("com.android.settings.TTS_SETTINGS");
                                  j.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  startActivity(j);
                              } catch (Exception ignored) { }
                          }
                      });
                  }
              }

              @Override
              protected void onPause() {
                  if (tts != null) tts.stop();
                  super.onPause();
              }

              @Override
              protected void onDestroy() {
                  if (tts != null) tts.shutdown();
                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  web.evaluateJavascript("(window.handleBack&&window.handleBack())?'1':'0'", v -> {
                      if (v == null || !v.contains("1")) finish();
                  });
              }
          }
          EOF_5
