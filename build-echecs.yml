          {id:'roque',mod:'Les bases',t:'Mettre son roi à l’abri : le roque',pre:['e2e4','e7e5','g1f3','b8c6','f1c4','f8c5'],
          intro:`<p>Au centre, le roi est exposé dès que les colonnes s'ouvrent. Le <b>roque</b> le met à l'abri derrière ses pions et active une tour, en un seul coup.</p><ul><li>Interdit si le roi est en échec.</li><li>Interdit si le roi traverse une case attaquée.</li><li>Interdit si le roi ou la tour ont déjà bougé.</li></ul>`,
          steps:[
          {q:'e1g1',p:"À vous : faites le petit roque. Touchez le roi, puis la case g1.",s:"Le roi est en g1, la tour en f1. Les pions f2, g2 et h2 forment un bouclier.",h:['g1','f1']},
          {m:'g8f6',s:"Les Noirs développent leur cavalier."},
          {m:'d2d3',s:"Les Blancs ouvrent la route à leur fou c1."},
          {m:'e8g8',s:"Les Noirs roquent aussi. Après le roque, évitez d'avancer les pions devant votre roi : ils sont son armure.",h:['g8','f8']}]},
          {id:'dame',mod:'Les bases',t:'Ne sortez pas la dame trop tôt',
          intro:`<p>La dame vaut 9 : dès qu'une pièce plus faible l'attaque, elle doit fuir, et on perd du temps. Voyons ce qui arrive quand on la sort trop tôt.</p>`,
          steps:[
          {m:'e2e4',s:"Début normal."},{m:'e7e5',s:""},
          {m:'d1h5',s:"La dame sort dès le deuxième coup et menace déjà le pion e5 et le point f7.",a:['r:h5e5','r:h5f7']},
          {m:'b8c6',s:"Les Noirs défendent e5 en développant une pièce."},
          {m:'f1c4',s:"Le fou vise f7 : menace de mat en f7 !",a:['r:c4f7','r:h5f7']},
          {q:'g7g6',ok:['d8e7','d8f6'],p:"À vous avec les Noirs : défendez-vous en chassant la dame avec un pion.",s:"Bien joué ! Le pion attaque la dame, qui doit encore bouger.",a:['r:g6h5']},
          {m:'h5f3',s:"La dame revient menacer f7.",a:['r:f3f7']},
          {m:'g8f6',s:"Le cavalier défend f7 tout en se développant."},
          {m:'f3b3',s:"La dame bouge pour la quatrième fois, en visant f7 avec le fou.",a:['r:c4f7']},
          {m:'d8e7',s:"La dame noire défend f7."},
          {m:'b1c3',s:""},
          {m:'c6d4',s:"Le cavalier attaque la dame et le pion c2, avec gain de temps. Les Noirs ont trois pièces développées, les Blancs ont perdu beaucoup de temps.",a:['r:d4b3','r:d4c2']}]},
          {id:'methode',mod:'Les bases',t:'La méthode : échecs, prises, menaces',fen:'r1bqkb1r/pppp1ppp/2n2n2/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR b KQkq - 3 3',
          intro:`<p>La plupart des parties se perdent sur une erreur tactique. Avant <b>chaque</b> coup, vérifiez dans cet ordre :</p><ul><li><b>Échecs</b> : lesquels puis-je donner ? Lesquels peut-il donner ?</li><li><b>Prises</b> : quelles pièces peuvent être prises ?</li><li><b>Menaces</b> : que veut faire l'adversaire avec son dernier coup ?</li></ul><p>Puis le <b>contrôle anti-gaffe</b> : après mon coup, une pièce reste-t-elle sans défense ?</p>`,
          steps:[
          {s:"Ici les Noirs viennent de jouer cavalier f6, sans regarder la menace blanche. Quelle est la menace ?",a:['r:h5f7','r:c4f7']},
          {m:'a7a6',s:"Les Noirs jouent un coup sans réfléchir…"},
          {q:'h5f7',p:"Appliquez la méthode : regardez d'abord les échecs !",s:"Échec et mat ! Un simple contrôle des échecs et des prises aurait évité cela aux Noirs."}]},

          /* ================= LES OUVERTURES ================= */
          {id:'italienne',mod:'Les ouvertures',t:'La partie italienne',
          intro:`<p>L'une des plus anciennes ouvertures. Les Blancs développent vite leurs pièces et visent le point faible <b>f7</b>. Idéale pour apprendre.</p><p class="mut">1.e4 e5 2.Cf3 Cc6 3.Fc4</p>`,
          steps:[
          {m:'e2e4',s:"Les Blancs occupent le centre."},
          {m:'e7e5',s:"Les Noirs prennent leur part du centre."},
          {q:'g1f3',p:"À vous : développez une pièce en attaquant le pion e5.",s:"Le cavalier sort et attaque e5.",a:['r:f3e5']},
          {m:'b8c6',s:"Le cavalier noir défend e5.",a:['g:c6e5']},
          {q:'f1c4',p:"Placez le fou sur la diagonale qui vise f7, le point le plus faible des Noirs.",s:"Voilà la partie italienne. Le pion f7 n'est défendu que par le roi.",a:['r:c4f7']},
          {m:'f8c5',s:"Les Noirs copient : leur fou vise f2. C'est le Giuoco Piano, le jeu tranquille.",a:['r:c5f2']},
          {m:'c2c3',s:"Les Blancs préparent d4 pour construire un grand centre.",a:['b:d2d4']},
          {m:'g8f6',s:"Les Noirs développent et attaquent le pion e4.",a:['r:f6e4']},
          {m:'d2d4',s:"Les Blancs frappent au centre et attaquent le fou c5 et le pion e5."},
          {m:'e5d4',s:"Les Noirs prennent."},
          {m:'c3d4',s:"Les Blancs reprennent : deux pions centraux côte à côte, un idéal.",h:['d4','e4']},
          {m:'c5b4',s:"Échec du fou : les Noirs gagnent un temps."},
          {m:'c1d2',s:"Les Blancs couvrent l'échec en développant le fou."},
          {m:'b4d2',s:"Les Noirs échangent les fous."},
          {m:'b1d2',s:"Le cavalier reprend et se développe."},
          {m:'d7d5',s:"Les Noirs contestent tout de suite le centre : c'est le bon réflexe."},
          {m:'e4d5',s:""},{m:'f6d5',s:"Le cavalier reprend et s'installe au centre."},
          {m:'d1b3',s:"La dame attaque le pion b7, et le fou c4 vise le cavalier d5. Position équilibrée, pleine d'idées pour les deux camps.",a:['r:b3b7','r:c4d5']}]},
          {id:'espagnole',mod:'Les ouvertures',t:'La partie espagnole',
          intro:`<p>Aussi appelée <b>Ruy Lopez</b>, c'est l'ouverture préférée des champions du monde. Les Blancs mettent une pression durable sur le pion e5.</p><p class="mut">1.e4 e5 2.Cf3 Cc6 3.Fb5</p>`,
          steps:[
          {m:'e2e4',s:""},{m:'e7e5',s:""},{m:'g1f3',s:"Attaque du pion e5."},{m:'b8c6',s:"Défense du pion e5."},
          {q:'f1b5',p:"À vous : attaquez la pièce qui défend le pion e5.",s:"C'est la partie espagnole. Le fou attaque le défenseur de e5.",a:['r:b5c6','g:c6e5']},
          {m:'a7a6',s:"Les Noirs demandent au fou ce qu'il veut faire. C'est la suite la plus jouée.",a:['r:a6b5']},
          {m:'b5a4',s:"Le fou recule mais garde le contact avec le cavalier."},
          {m:'g8f6',s:"Les Noirs développent et attaquent le pion e4.",a:['r:f6e4']},
          {q:'e1g1',p:"À vous : le pion e4 n'est pas vraiment en danger. Mettez votre roi à l'abri.",s:"Le roque. Si le cavalier prend e4, la tour viendra en e1 et regagnera le pion."},
          {m:'f8e7',s:"Les Noirs préparent leur propre roque."},
          {m:'f1e1',s:"La tour défend e4.",a:['g:e1e4']},
          {m:'b7b5',s:"Les Noirs chassent le fou.",a:['r:b5a4']},
          {m:'a4b3',s:"Le fou se place sur une excellente diagonale qui vise f7.",a:['r:b3f7']},
          {m:'d7d6',s:"Les Noirs consolident e5 et libèrent leur fou c8."},
          {m:'c2c3',s:"Les Blancs préparent d4, et une case de retraite en c2 pour le fou."},
          {m:'e8g8',s:"Les Noirs roquent à leur tour."},
          {m:'h2h3',s:"Petit coup important : il empêche le fou c8 de venir clouer le cavalier en g4. Position typique, riche en plans.",a:['r:c8g4']}]},
          {id:'sicilienne',mod:'Les ouvertures',t:'La défense sicilienne',
          intro:`<p>La réponse la plus combative à 1.e4. Les Noirs contrôlent d4 avec un pion de côté et créent un <b>déséquilibre</b> : ils jouent pour gagner.</p><p class="mut">1.e4 c5</p>`,
          steps:[
          {m:'e2e4',s:""},
          {m:'c7c5',s:"La défense sicilienne ! Le pion c5 contrôle la case d4.",a:['g:c5d4']},
          {m:'g1f3',s:"Développement et préparation de d4."},
          {m:'d7d6',s:"Les Noirs contrôlent e5 et libèrent le fou c8."},
          {m:'d2d4',s:"Les Blancs ouvrent le jeu."},
          {m:'c5d4',s:"Les Noirs échangent un pion de côté contre un pion central : c'est l'idée clé de la Sicilienne."},
          {m:'f3d4',s:"Le cavalier reprend au centre."},
          {m:'g8f6',s:"Développement avec attaque du pion e4.",a:['r:f6e4']},
          {q:'b1c3',p:"À vous : défendez le pion e4 en développant une pièce.",s:"Le cavalier défend e4.",a:['g:c3e4']},
          {m:'a7a6',s:"La variante Najdorf, préférée de Fischer et Kasparov. Le petit coup a6 interdit la case b5 aux pièces blanches et prépare b5.",a:['b:b7b5']},
          {m:'c1e3',s:"Les Blancs développent le fou."},
          {m:'e7e5',s:"Les Noirs chassent le cavalier et gagnent de l'espace.",a:['r:e5d4']},
          {m:'d4b3',s:"Le cavalier recule."},
          {m:'c8e6',s:"Le fou contrôle d5, la case clé de cette position.",a:['g:e6d5'],h:['d5']},
          {m:'f2f3',s:"Les Blancs consolident e4 et préparent une attaque de pions avec g4. Souvent, les deux camps roquent de côtés opposés.",a:['b:g2g4']}]},
          {id:'francaise',mod:'Les ouvertures',t:'La défense française',
          intro:`<p>Les Noirs préparent d5 pour attaquer e4. Ouverture <b>solide</b> : les Noirs acceptent moins d'espace pour attaquer ensuite la chaîne de pions blanche.</p><p class="mut">1.e4 e6 2.d4 d5</p>`,
          steps:[
          {m:'e2e4',s:""},
          {m:'e7e6',s:"La défense française. Les Noirs préparent d5.",a:['b:d7d5']},
          {m:'d2d4',s:"Les Blancs construisent un grand centre."},
          {m:'d7d5',s:"Attaque du pion e4.",a:['r:d5e4']},
          {m:'b1c3',s:"Le cavalier défend e4.",a:['g:c3e4']},
          {m:'g8f6',s:"Une deuxième attaque sur e4.",a:['r:f6e4']},
          {m:'e4e5',s:"Les Blancs avancent et chassent le cavalier, en gagnant de l'espace."},
          {m:'f6d7',s:"Le cavalier recule."},
          {m:'f2f4',s:"Les Blancs soutiennent e5 : un centre énorme.",h:['d4','e5','f4']},
          {q:'c7c5',p:"À vous avec les Noirs : attaquez la base de la chaîne de pions blanche.",s:"C'est le plan de la Française : on attaque la chaîne à sa base, le pion d4.",a:['r:c5d4'],h:['d4']},
          {m:'g1f3',s:"Le cavalier soutient d4."},
          {m:'b8c6',s:"Deuxième attaque sur d4.",a:['r:c6d4']},
          {m:'c1e3',s:"Troisième défenseur pour d4."},
          {m:'c5d4',s:"Les Noirs échangent."},
          {m:'f3d4',s:""},
          {m:'f8c5',s:"Les Noirs attaquent encore le cavalier d4. Toute la partie tourne autour de cette case.",a:['r:c5d4']}]},
          {id:'carokann',mod:'Les ouvertures',t:'La défense Caro-Kann',
          intro:`<p>Comme la Française, les Noirs préparent d5, mais le fou c8 reste <b>libre de sortir</b>. Ouverture très solide, sans faiblesses.</p><p class="mut">1.e4 c6 2.d4 d5</p>`,
          steps:[
          {m:'e2e4',s:""},{m:'c7c6',s:"La Caro-Kann prépare d5.",a:['b:d7d5']},
          {m:'d2d4',s:""},{m:'d7d5',s:"Attaque du pion e4."},
          {m:'b1c3',s:"Défense du pion e4."},{m:'d5e4',s:"Les Noirs échangent au centre."},
          {m:'c3e4',s:"Le cavalier reprend."},
          {q:'c8f5',p:"À vous avec les Noirs : sortez le fou c8 en attaquant le cavalier.",s:"Exactement ! Le fou sort avant e6 : c'est l'avantage de la Caro-Kann sur la Française.",a:['r:f5e4']},
          {m:'e4g3',s:"Le cavalier recule et attaque le fou.",a:['r:g3f5']},
          {m:'f5g6',s:"Le fou se replace."},
          {m:'h2h4',s:"Les Blancs menacent h5 pour piéger le fou.",a:['b:h4h5']},
          {m:'h7h6',s:"Les Noirs donnent une case de retraite au fou."},
          {m:'g1f3',s:""},{m:'b8d7',s:"Développement souple."},
          {m:'h4h5',s:"Le pion chasse le fou."},{m:'g6h7',s:"Le fou recule en h7."},
          {m:'f1d3',s:"Les Blancs proposent l'échange des fous."},
          {m:'h7d3',s:""},
          {m:'d1d3',s:"Les Noirs ont une position très solide, sans faiblesses : c'est l'esprit de la Caro-Kann."}]},
          {id:'gambitdame',mod:'Les ouvertures',t:'Le gambit dame',
          intro:`<p>Les Blancs offrent un pion de côté pour attaquer le centre noir. Ce n'est pas un vrai sacrifice : le pion est souvent récupéré.</p><p class="mut">1.d4 d5 2.c4</p>`,
          steps:[
          {m:'d2d4',s:"Le pion de la dame au centre."},{m:'d7d5',s:"Les Noirs bloquent."},
          {q:'c2c4',p:"À vous : proposez un pion pour attaquer le centre noir.",s:"Voilà le gambit dame.",a:['r:c4d5']},
          {m:'e7e6',s:"Les Noirs refusent le gambit et soutiennent d5. C'est le gambit dame refusé.",a:['g:e6d5']},
          {m:'b1c3',s:"Pression sur d5.",a:['r:c3d5']},
          {m:'g8f6',s:"Défense de d5."},
          {m:'c1g5',s:"Le fou cloue le cavalier sur la dame.",a:['r:g5f6','r:f6d8']},
          {m:'f8e7',s:"Les Noirs déclouent."},
          {m:'e2e3',s:"Les Blancs ouvrent la route au fou f1."},
          {m:'e8g8',s:""},{m:'g1f3',s:""},{m:'b8d7',s:""},
          {m:'a1c1',s:"La tour se place sur la colonne c, qui va s'ouvrir."},
          {m:'c7c6',s:"Les Noirs consolident d5."},
          {m:'f1d3',s:""},
          {m:'d5c4',s:"Les Noirs prennent quand le fou a déjà bougé : ils gagnent un temps."},
          {m:'d3c4',s:"Les Blancs ont un peu plus d'espace. Les Noirs vont chercher à se libérer avec e5 ou c5.",a:['b:e6e5','b:c6c5']}]},
          {id:'londres',mod:'Les ouvertures',t:'Le système de Londres',
          intro:`<p>Un <b>système</b> : les Blancs jouent presque toujours les mêmes coups, quelle que soit la réponse noire. Parfait pour débuter avec les Blancs.</p><p class="mut">1.d4, 2.Ff4, 3.e3, 4.Cf3, 5.c3</p>`,
          steps:[
          {m:'d2d4',s:""},{m:'d7d5',s:""},
          {q:'c1f4',p:"À vous : sortez le fou de la dame tout de suite, avant de jouer e3.",s:"La clé du système : le fou sort avant que e3 ne lui ferme la porte.",a:['b:f4b8']},
          {m:'g8f6',s:""},
          {m:'e2e3',s:"Les Blancs forment leur triangle de pions."},
          {m:'e7e6',s:""},{m:'g1f3',s:""},
          {m:'c7c5',s:"Les Noirs attaquent d4.",a:['r:c5d4']},
          {q:'c2c3',p:"À vous : soutenez d4 avec un pion.",s:"Le triangle c3, d4, e3 est très solide.",h:['c3','d4','e3']},
          {m:'b8c6',s:""},
          {m:'b1d2',s:"Le cavalier va en d2 pour ne pas gêner le pion c."},
          {m:'f8d6',s:"Les Noirs proposent l'échange de fous.",a:['r:d6f4']},
          {m:'f4g3',s:"Le fou recule et garde sa diagonale."},
          {m:'e8g8',s:""},
          {m:'f1d3',s:"Schéma harmonieux. Prochaine étape : roquer, puis cavalier en e5 ou poussée e4."}]},
          {id:'indienneroi',mod:'Les ouvertures',t:'La défense indienne du roi',
          intro:`<p>Les Noirs laissent les Blancs prendre le centre… pour mieux l'attaquer ensuite. Ouverture d'<b>attaque</b> sur le roi.</p><p class="mut">1.d4 Cf6 2.c4 g6</p>`,
          steps:[
          {m:'d2d4',s:""},{m:'g8f6',s:"Les Noirs développent sans occuper le centre."},
          {m:'c2c4',s:""},{m:'g7g6',s:"Préparation du fianchetto : le fou ira en g7."},
          {m:'b1c3',s:""},{m:'f8g7',s:"Le fou en g7 vise le centre sur la grande diagonale.",a:['g:g7d4']},
          {m:'e2e4',s:"Les Blancs prennent tout le centre."},
          {m:'d7d6',s:"Les Noirs laissent faire et préparent e5."},
          {m:'g1f3',s:""},{m:'e8g8',s:"Le roi est en sécurité."},
          {m:'f1e2',s:""},
          {q:'e7e5',p:"À vous avec les Noirs : frappez enfin au centre.",s:"Les Noirs contestent le centre."},
          {m:'e1g1',s:""},{m:'b8c6',s:"Pression sur d4."},
          {m:'d4d5',s:"Les Blancs ferment le centre."},
          {m:'c6e7',s:"Plan typique : les Noirs attaquent à l'aile roi avec f5, les Blancs à l'aile dame avec c5.",a:['b:f7f5','b:c4c5']}]},
          {id:'scandinave',mod:'Les ouvertures',t:'La défense scandinave',
          intro:`<p>Les Noirs attaquent e4 dès le premier coup. Simple, mais la dame noire sort tôt.</p><p class="mut">1.e4 d5</p>`,
          steps:[
          {m:'e2e4',s:""},{m:'d7d5',s:"Attaque immédiate du pion e4."},
          {m:'e4d5',s:""},{m:'d8d5',s:"La dame reprend, mais elle est exposée au centre."},
          {q:'b1c3',p:"À vous : développez une pièce en attaquant la dame.",s:"Développement avec gain de temps : la dame doit fuir.",a:['r:c3d5']},
          {m:'d5a5',s:"La dame se met en a5, d'où elle cloue parfois le cavalier.",a:['r:a5c3']},
          {m:'d2d4',s:""},{m:'g8f6',s:""},{m:'g1f3',s:""},
          {m:'c7c6',s:"Les Noirs donnent une case de retraite à leur dame en c7."},
          {m:'f1c4',s:""},{m:'c8f5',s:"Le fou sort avant e6."},
          {m:'c1d2',s:"Le fou défend c3 et prépare cavalier d5, qui découvrirait une attaque sur la dame.",a:['b:c3d5']},
          {m:'e7e6',s:"Position solide pour les Noirs, mais les Blancs ont une petite avance de développement."}]},
          {id:'anglaise',mod:'Les ouvertures',t:'L’ouverture anglaise',
          intro:`<p>Les Blancs contrôlent la case d5 par le côté, avec le pion c. Jeu souple et positionnel.</p><p class="mut">1.c4</p>`,
          steps:[
          {m:'c2c4',s:"L'anglaise contrôle d5.",a:['g:c4d5']},
          {m:'e7e5',s:"Les Noirs prennent le centre. C'est comme une Sicilienne inversée."},
          {m:'b1c3',s:""},{m:'g8f6',s:""},
          {m:'g2g3',s:"Préparation du fianchetto."},
          {m:'d7d5',s:""},{m:'c4d5',s:""},{m:'f6d5',s:""},
          {m:'f1g2',s:"Le fou en g2 vise d5 et toute la grande diagonale.",a:['r:g2d5']},
          {m:'d5b6',s:"Le cavalier quitte la diagonale dangereuse."},
          {m:'g1f3',s:"Attaque du pion e5.",a:['r:f3e5']},
          {m:'b8c6',s:""},{m:'e1g1',s:""},
          {m:'f8e7',s:"Les Blancs vont jouer à l'aile dame avec a3 et b4.",a:['b:a2a3','b:b2b4']}]},

          /* ================= LES STRATÉGIES ================= */
          {id:'grec',mod:'Les stratégies',t:'Attaque sur le roi : le sacrifice grec',fen:'r1b2rk1/ppqn1ppp/2n1p3/3pP3/3P4/2NB1N2/PPP2PPP/R1BQ1RK1 w - - 0 10',
          intro:`<p>Stratégie d'<b>attaque</b>. Quand le roi a roqué et qu'aucun cavalier n'est en f6 pour défendre h7, le sacrifice du fou en h7 est souvent gagnant.</p><p>Conditions : un fou sur la diagonale de h7, un cavalier pour g5, la dame prête à venir en h5.</p>`,h:['h7'],a:['r:d3h7','b:f3g5','b:d1h5'],
          steps:[
          {q:'d3h7',p:"Sacrifiez le fou sur le pion qui protège le roi.",s:"Le sacrifice grec ! Le fou prend h7 avec échec."},
          {m:'g8h7',s:"Le roi prend le fou."},
          {m:'f3g5',s:"Le cavalier arrive en g5 avec échec, et prépare l'arrivée de la dame.",a:['b:d1h5']},
          {m:'h7g8',s:"Le roi recule. S'il va en g6, la dame vient en g4 ou d3 avec une attaque terrible."},
          {m:'d1h5',s:"La dame menace mat en h7. Les Noirs ne peuvent plus se défendre correctement.",a:['r:h5h7','r:g5h7']}]},
          {id:'avantposte',mod:'Les stratégies',t:'Jeu positionnel : l’avant-poste',fen:'4r1k1/pp3ppp/3p4/4p3/4P3/5N2/PPP2PPP/3R2K1 w - - 0 1',
          intro:`<p>Stratégie <b>positionnelle</b>. La case d5 est un « trou » : aucun pion noir ne pourra jamais l'attaquer. Un cavalier installé là sera intouchable.</p>`,h:['d5'],
          steps:[
          {m:'f3d2',s:"Le cavalier commence son voyage vers d5.",a:['b:d2c4','b:c4e3','b:e3d5']},
          {m:'h7h6',s:"Les Noirs attendent."},
          {m:'d2c4',s:"En c4, il attaque déjà le pion d6.",a:['r:c4d6']},
          {m:'g7g5',s:"Les Noirs n'ont rien contre ce plan."},
          {m:'c4e3',s:"Le cavalier se rapproche de son but."},
          {m:'g8g7',s:""},
          {q:'e3d5',p:"À vous : installez le cavalier sur son avant-poste.",s:"Le cavalier en d5 domine l'échiquier. Aucun pion ne pourra jamais le chasser.",h:['d5']}]},
          {id:'colonnes',mod:'Les stratégies',t:'Colonnes ouvertes et 7e rangée',fen:'4r1k1/pp3ppp/2p5/8/8/2P5/PP3PPP/R4RK1 w - - 0 1',
          intro:`<p>La colonne d n'a plus de pions : c'est une <b>colonne ouverte</b>, l'autoroute des tours. La tour qui l'occupe en premier pénètre ensuite sur la 7e rangée.</p>`,h:['d1','d2','d3','d4','d5','d6','d7','d8'],
          steps:[
          {q:'a1d1',p:"À vous : placez une tour sur la colonne ouverte.",s:"La tour contrôle maintenant toute la colonne d."},
          {m:'g8f8',s:"Le roi noir se rapproche pour défendre."},
          {m:'d1d7',s:"La tour pénètre sur la 7e rangée et attaque b7.",a:['r:d7b7']},
          {m:'e8e7',s:"Les Noirs proposent l'échange de tours."},
          {q:'f1d1',p:"À vous : renforcez la tour d7 avec l'autre tour.",s:"Les tours sont doublées. Si les Noirs échangent, l'autre tour reprend et reste active."},
          {m:'e7d7',s:""},{m:'d1d7',s:"La tour reprend et reste sur la 7e rangée."},
          {m:'f8e8',s:""},
          {m:'d7b7',s:"La tour gagne le pion b7. Une tour sur la 7e rangée vaut souvent un pion de plus."}]},
          {id:'majorite',mod:'Les stratégies',t:'Majorité de pions et pion passé',fen:'6k1/pp3ppp/8/8/8/8/PPP2PPP/6K1 w - - 0 1',
          intro:`<p>Les Blancs ont 3 pions contre 2 à l'aile dame : c'est une <b>majorité</b>. Le plan : avancer ensemble pour créer un <b>pion passé</b>, un pion qu'aucun pion adverse ne peut arrêter.</p>`,h:['a2','b2','c2'],
          steps:[
          {m:'c2c4',s:"Le pion sans adversaire en face avance le premier."},
          {m:'h7h6',s:""},
          {m:'b2b4',s:"Les pions avancent ensemble, en se soutenant."},
          {m:'g7g5',s:""},{m:'c4c5',s:""},{m:'f7f5',s:""},
          {m:'b4b5',s:"Les pions arrivent au contact."},
          {m:'g8f7',s:""},
          {q:'c5c6',p:"À vous : poussez le pion pour forcer la création d'un pion passé.",s:"Le pion attaque b7."},
          {m:'b7c6',s:"Les Noirs prennent."},
          {m:'b5c6',s:"Un pion passé en c6 ! Seul le roi noir pourrait l'arrêter, et il est trop loin. Les pions passés doivent avancer !",h:['c6']}]},
          {id:'isole',mod:'Les stratégies',t:'Jouer contre le pion isolé',fen:'r1bq1rk1/pp2bppp/2n2n2/3p4/8/2N1PN2/PP2BPPP/R2Q1RK1 w - - 0 10',
          intro:`<p>Le pion d5 noir est <b>isolé</b> : aucun pion noir sur les colonnes c et e pour le défendre. Le plan : le bloquer, puis l'attaquer avec les pièces.</p>`,h:['d5'],
          steps:[
          {q:'f3d4',p:"À vous : placez un cavalier juste devant le pion isolé.",s:"La case d4 est parfaite : aucun pion noir ne peut chasser le cavalier. On bloque d'abord, on attaque ensuite.",h:['d4']},
          {m:'f8e8',s:"Les Noirs activent leur tour."},
          {m:'e2f3',s:"Le fou attaque d5.",a:['r:f3d5']},
          {m:'c8e6',s:"Les Noirs défendent d5."},
          {m:'d1b3',s:"La dame attaque b7 et ajoute de la pression.",a:['r:b3b7']},
          {m:'d8d7',s:""},
          {m:'f1d1',s:"La tour se place derrière le cavalier. Les Noirs vont passer la partie à défendre leur pion faible."}]},
          {id:'minorite',mod:'Les stratégies',t:'L’attaque de minorité',fen:'r4rk1/pp3ppp/2p5/3p4/3P4/4P3/PP3PPP/R4RK1 w - - 0 1',
          intro:`<p>Structure typique du gambit dame. Les Blancs ont 2 pions contre 3 à l'aile dame, et pourtant ils attaquent avec cette <b>minorité</b> pour créer une faiblesse dans le camp noir.</p>`,h:['a2','b2','a7','b7','c6'],
          steps:[
          {m:'b2b4',s:"Le pion b part à l'attaque.",a:['b:b4b5']},
          {m:'a7a6',s:""},
          {m:'a2a4',s:"Le pion a soutient l'avance."},
          {m:'g7g6',s:""},
          {m:'b4b5',s:"Le contact !"},
          {m:'a6b5',s:""},{m:'a4b5',s:""},{m:'g8g7',s:""},
          {q:'b5c6',p:"À vous : prenez pour casser la structure noire.",s:"Après la reprise, le pion noir en c6 sera faible."},
          {m:'b7c6',s:""},
          {m:'f1c1',s:"La tour attaque le pion faible c6. Les Noirs devront le défendre très longtemps.",a:['r:c1c6'],h:['c6']}]},
          {id:'roquesopp',mod:'Les stratégies',t:'Roques opposés : la course à l’attaque',pre:['e2e4','c7c5','g1f3','d7d6','d2d4','c5d4','f3d4','g8f6','b1c3','a7a6','c1e3','e7e5','d4b3','c8e6','f2f3'],
          intro:`<p>Quand les rois sont de <b>côtés opposés</b>, chaque camp peut lancer ses pions vers le roi adverse sans affaiblir le sien. C'est une course : la vitesse compte plus que le matériel.</p>`,
          steps:[
          {m:'f8e7',s:"Les Noirs se développent."},
          {m:'d1d2',s:"La dame se prépare au grand roque."},
          {m:'e8g8',s:"Les Noirs roquent côté roi."},
          {q:'e1c1',p:"À vous : roquez du côté opposé, à l'aile dame.",s:"Grand roque ! Les rois sont maintenant de côtés opposés."},
          {m:'b8d7',s:""},
          {m:'g2g4',s:"Les Blancs lancent l'avalanche de pions vers le roi noir.",a:['b:g4g5','b:h2h4']},
          {m:'b7b5',s:"Les Noirs font de même vers le roi blanc.",a:['b:b5b4','b:a6a5']},
          {m:'g4g5',s:"Le pion chasse le cavalier qui défend le roi.",a:['r:g5f6']},
          {m:'b5b4',s:"Les Noirs chassent le cavalier c3. Le premier qui ouvre une colonne vers le roi adverse gagne souvent.",a:['r:b4c3']}]},
          {id:'prophylaxie',mod:'Les stratégies',t:'La prophylaxie',pre:['e2e4','e7e5','g1f3','b8c6','f1c4','f8c5','c2c3','g8f6','d2d3','d7d6'],
          intro:`<p>La prophylaxie, c'est <b>empêcher le plan adverse</b> avant qu'il n'arrive. Avant chaque coup, demandez-vous : que veut faire mon adversaire ?</p>`,a:['r:c8g4'],
          steps:[
          {q:'h2h3',p:"Les Noirs aimeraient mettre leur fou en g4 pour clouer le cavalier. Empêchez-le avec un pion.",s:"Le petit coup h3 enlève la case g4 au fou, et donne une case de sortie au roi après le roque.",a:['r:h3g4']},
          {m:'a7a6',s:"Les Noirs aussi pensent prophylaxie : ils préparent une retraite en a7 pour leur fou, au cas où les Blancs joueraient b4 ou d4.",a:['b:c5a7']},
          {m:'e1g1',s:""},
          {m:'c5a7',s:"Le fou se met à l'abri à l'avance. Deux joueurs qui pensent aux plans de l'adversaire !"}]},
          {id:'fous',mod:'Les stratégies',t:'Bon fou et mauvais fou',fen:'4k3/pp3ppp/4p3/3pP3/3P4/8/PP3PPP/2B1K3 w - - 0 1',
          intro:`<p>Un fou est <b>mauvais</b> quand ses propres pions sont bloqués sur des cases de sa couleur. Ici le fou c1 circule sur les cases foncées, comme les pions d4 et e5 : il a peu d'avenir.</p><ul><li>Placez vos pions sur la couleur <b>opposée</b> à celle de votre fou.</li><li>Échangez votre mauvais fou, ou sortez-le devant la chaîne de pions avant de la fermer.</li></ul>`,h:['c1','d4','e5'],
          steps:[
          {m:'c1g5',s:"Le fou sort devant ses pions : il devient actif.",a:['b:g5d8']},
          {m:'f7f6',s:"Les Noirs attaquent le fou et la chaîne."},
          {m:'e5f6',s:""},{m:'g7f6',s:""},
          {m:'g5f6',s:"Le fou blanc n'était plus enfermé : il a gagné un pion. Un fou devant ses pions vaut bien plus qu'un fou derrière."}]},
          {id:'plan',mod:'Les stratégies',t:'Comment faire un plan',fen:'r1bq1rk1/pp2bppp/2n1pn2/3p4/2PP4/2N1PN2/PP3PPP/R2QKB1R w KQ - 0 8',
          intro:`<p>Un mauvais plan vaut mieux que pas de plan du tout. Observez la position en 4 questions :</p><ul><li><b>1. Matériel</b> : qui a plus de pièces ?</li><li><b>2. Sécurité des rois</b> : un roi est-il exposé ? Attaquez-le.</li><li><b>3. Structure de pions</b> : quelles faiblesses viser ?</li><li><b>4. Pièce la plus mal placée</b> : améliorez votre pire pièce.</li></ul><p>Règle d'or : <b>attaquez du côté où vous avez plus d'espace</b>.</p>`,
          steps:[
          {s:"Ici, le roi blanc n'a pas encore roqué : c'est la priorité. Et le fou f1 n'est pas sorti.",a:['b:f1d3','b:e1g1']},
          {q:'f1d3',p:"À vous : développez votre pièce la plus mal placée.",s:"Le fou sort et prépare le roque."},
          {m:'d5c4',s:"Les Noirs prennent le pion."},
          {m:'d3c4',s:"Le fou reprend. Maintenant, roquer."},
          {m:'a7a6',s:""},
          {q:'e1g1',p:"Mettez le roi à l'abri.",s:"Les Blancs ont fini leur développement. Prochaine étape : centraliser les tours."}]},

          /* ================= LA TACTIQUE ================= */
          {id:'fourchette',mod:'La tactique',t:'La fourchette du cavalier',fen:'r3k3/8/8/1N6/8/8/8/4K3 w - - 0 1',
          intro:`<p>Une <b>fourchette</b> : une pièce attaque deux cibles en même temps. Le cavalier est le roi des fourchettes, car il saute par-dessus les pièces.</p>`,
          steps:[
          {q:'b5c7',p:"Trouvez le coup de cavalier qui attaque le roi et la tour.",s:"Échec et attaque de la tour : c'est une fourchette !",a:['r:c7e8','r:c7a8']},
          {m:'e8d7',s:"Le roi doit s'occuper de l'échec."},
          {m:'c7a8',s:"Le cavalier ramasse la tour."}]},
          {id:'fourchettepion',mod:'La tactique',t:'La fourchette de pion',fen:'6k1/8/2n1r3/8/3P4/8/8/6K1 w - - 0 1',
          intro:`<p>Même un simple pion peut faire une fourchette. Et un pion qui gagne une pièce, c'est une excellente affaire !</p>`,
          steps:[
          {q:'d4d5',p:"Trouvez la poussée de pion qui attaque deux pièces.",s:"Le pion attaque le cavalier et la tour.",a:['r:d5c6','r:d5e6']},
          {m:'e6e5',s:"La tour s'enfuit…"},
          {m:'d5c6',s:"…et le pion prend le cavalier."}]},
          {id:'clouage',mod:'La tactique',t:'Le clouage',fen:'6k1/5qpp/8/8/8/1P6/6PP/5BK1 w - - 0 1',
          intro:`<p>Une pièce <b>clouée</b> ne peut pas bouger, car elle protège une pièce plus précieuse derrière elle. Quand c'est le roi derrière, elle ne peut pas bouger du tout.</p>`,
          steps:[
          {q:'f1c4',p:"Clouez la dame noire sur son roi.",s:"La dame est clouée : si elle quittait la diagonale, le roi serait en échec.",a:['r:c4f7','r:f7g8']},
          {m:'f7c4',s:"Les Noirs limitent les dégâts en prenant le fou."},
          {m:'b3c4',s:"Le pion reprend : les Blancs ont gagné la dame contre un fou."}]},
          {id:'enfilade',mod:'La tactique',t:'L’enfilade',fen:'7q/8/8/4k3/8/8/3B4/6K1 w - - 0 1',
          intro:`<p>L'<b>enfilade</b> est l'inverse du clouage : la pièce précieuse est devant. Elle doit s'écarter, et la pièce cachée derrière tombe.</p>`,
          steps:[
          {q:'d2c3',p:"Le roi et la dame noirs sont sur la même diagonale. Donnez échec avec le fou.",s:"Échec ! Le roi doit quitter la diagonale.",a:['r:c3e5','r:e5h8']},
          {m:'e5e6',s:"Le roi s'écarte."},
          {m:'c3h8',s:"Le fou prend la dame cachée derrière."}]},
          {id:'decouverte',mod:'La tactique',t:'L’attaque à la découverte',fen:'4k3/8/8/8/q3N3/8/8/4R1K1 w - - 0 1',
          intro:`<p>Une pièce bouge et <b>démasque</b> l'attaque d'une autre pièce placée derrière elle. On obtient deux menaces d'un seul coup.</p>`,a:['b:e1e8'],
          steps:[
          {q:'e4c5',p:"Le cavalier masque la tour e1. Bougez-le pour donner échec avec la tour, tout en attaquant la dame.",s:"La tour donne échec, et le cavalier attaque la dame.",a:['r:e1e8','r:c5a4']},
          {m:'e8d8',s:"Le roi doit parer l'échec."},
          {m:'c5a4',s:"Le cavalier prend la dame."}]},
          {id:'doubleechec',mod:'La tactique',t:'Le double échec',fen:'2q1k3/8/8/8/4N3/8/8/4R1K1 w - - 0 1',
          intro:`<p>Le <b>double échec</b> est la découverte la plus puissante : deux pièces donnent échec en même temps. On ne peut ni prendre les deux ni s'interposer : seul le roi peut bouger.</p>`,
          steps:[
          {q:'e4d6',p:"Trouvez le double échec, qui attaque aussi la dame.",s:"Double échec ! Et le cavalier attaque aussi la dame.",a:['r:d6e8','r:e1e8','r:d6c8']},
          {m:'e8d8',s:"Seul le roi peut bouger."},
          {m:'d6c8',s:"Le cavalier prend la dame."},
          {m:'d8c8',s:"Le roi reprend le cavalier, mais les Blancs ont gagné une dame contre un cavalier."}]},
          {id:'eliminer',mod:'La tactique',t:'Éliminer le défenseur',fen:'3r2k1/4qppp/8/8/8/8/3Q1PPP/3R2K1 w - - 0 1',
          intro:`<p>Quand une seule pièce défend un point important, <b>éliminez-la</b>, même au prix d'un sacrifice. Ici, la tour d8 garde la dernière rangée.</p>`,h:['d8'],
          steps:[
          {q:'d2d8',p:"Sacrifiez la dame pour détruire la défense.",s:"Échec ! Les Noirs sont obligés de reprendre avec la dame."},
          {m:'e7d8',s:"La dame noire reprend."},
          {q:'d1d8',p:"À vous : finissez la partie.",s:"Échec et mat ! Le roi est prisonnier de ses propres pions."}]},
          {id:'doubleattaque',mod:'La tactique',t:'La double attaque de la dame',fen:'r5k1/6pp/8/8/8/8/5PPP/3Q2K1 w - - 0 1',
          intro:`<p>La dame bouge dans toutes les directions : c'est la meilleure pièce pour attaquer deux cibles à la fois.</p>`,
          steps:[
          {q:'d1d5',p:"Trouvez la case d'où la dame attaque le roi et la tour.",s:"Échec au roi et attaque de la tour.",a:['r:d5g8','r:d5a8']},
          {m:'g8f8',s:"Le roi s'écarte."},
          {m:'d5a8',s:"La dame prend la tour avec échec."}]},

          /* ================= LES MATS ================= */
          {id:'couloir',mod:'Les mats',t:'Le mat du couloir',fen:'6k1/5ppp/8/8/8/8/5PPP/3R2K1 w - - 0 1',
          intro:`<p>Le roi est enfermé derrière ses propres pions. Une tour ou une dame sur la dernière rangée suffit pour le mater.</p><p>Prévention : faites une « fenêtre » pour votre roi avec h3 ou g3 au bon moment.</p>`,
          steps:[{q:'d1d8',p:"Donnez le mat du couloir.",s:"Échec et mat ! Les pions f7, g7 et h7 empêchent le roi de fuir."}]},
          {id:'legal',mod:'Les mats',t:'Le mat de Légal (piège célèbre)',
          intro:`<p>Un piège vieux de 270 ans. Les Blancs offrent leur dame… et matent avec trois pièces mineures.</p>`,
          steps:[
          {m:'e2e4',s:""},{m:'e7e5',s:""},{m:'g1f3',s:""},
          {m:'d7d6',s:"La défense Philidor."},
          {m:'f1c4',s:"Le fou vise f7.",a:['r:c4f7']},
          {m:'c8g4',s:"Le fou cloue le cavalier sur la dame.",a:['r:g4f3','r:f3d1']},
          {m:'b1c3',s:"Les Blancs développent tranquillement."},
          {m:'g7g6',s:"Les Noirs jouent un coup inutile."},
          {q:'f3e5',p:"À vous : prenez le pion e5, même si votre dame semble perdue !",s:"Le cavalier prend e5 et laisse la dame en prise : c'est le piège !",a:['r:g4d1']},
          {m:'g4d1',s:"Les Noirs prennent la dame. Grave erreur !"},
          {q:'c4f7',p:"Donnez échec avec le fou.",s:"Échec ! Le fou est protégé par le cavalier e5."},
          {m:'e8e7',s:"Le roi n'a qu'une seule case."},
          {q:'c3d5',p:"Donnez le mat avec un cavalier.",s:"Échec et mat ! Trois pièces mineures ont battu la dame. Leçon : vérifiez toujours avant de prendre."}]},
          {id:'etouffe',mod:'Les mats',t:'Le mat à l’étouffée',fen:'5r1k/6pp/8/6N1/2Q5/8/5PPP/6K1 w - - 0 1',
          intro:`<p>Le <b>mat de Philidor</b> : un cavalier mate un roi étouffé par ses propres pièces. L'une des plus belles combinaisons du jeu.</p>`,
          steps:[
          {q:'g5f7',p:"Commencez par un échec du cavalier.",s:"Échec !"},
          {m:'h8g8',s:"Le roi va en g8."},
          {q:'f7h6',p:"Trouvez le double échec !",s:"Double échec du cavalier et de la dame.",a:['r:h6g8','r:c4g8']},
          {m:'g8h8',s:"Le roi retourne dans le coin."},
          {q:'c4g8',p:"Le sacrifice incroyable : offrez la dame !",s:"La dame se sacrifie en g8. Seule la tour peut la prendre."},
          {m:'f8g8',s:"La tour prend… et enferme son propre roi."},
          {q:'h6f7',p:"Donnez le mat !",s:"Le mat à l'étouffée ! Le roi est entouré de ses propres pièces."}]},
          {id:'escalier',mod:'Les mats',t:'Le mat de l’escalier',fen:'8/8/8/8/5k2/1R6/8/R6K w - - 0 1',
          intro:`<p>Avec deux tours, on pousse le roi vers le bord : une tour bloque une rangée, l'autre donne échec sur la rangée suivante. Elles avancent comme sur un escalier.</p>`,
          steps:[
          {m:'a1a4',s:"Échec sur la 4e rangée. L'autre tour bloque déjà la 3e."},
          {m:'f4f5',s:"Le roi doit monter."},
          {q:'b3b5',p:"À vous : l'autre tour donne échec une rangée plus haut.",s:"Le roi doit encore monter."},
          {m:'f5f6',s:""},{m:'a4a6',s:""},{m:'f6f7',s:""},{m:'b5b7',s:""},{m:'f7f8',s:""},
          {q:'a6a8',p:"Le dernier pas de l'escalier !",s:"Échec et mat ! Les tours se sont relayées rangée par rangée."}]},
          {id:'dameroi',mod:'Les mats',t:'Mat avec la dame (attention au pat)',fen:'7k/8/5K2/8/8/8/8/6Q1 w - - 0 1',
          intro:`<p>Le roi noir est dans le coin. Il faut donner mat… sans faire <b>pat</b> ! Le pat, c'est quand le roi n'est pas en échec mais n'a plus aucun coup : la partie est nulle.</p>`,
          steps:[
          {s:"Attention : si la dame va en g6, le roi noir n'a plus de coup mais n'est pas en échec. C'est pat, partie nulle !",a:['r:g1g6']},
          {q:'g1g7',p:"Donnez le mat en un coup.",s:"Mat ! La dame est protégée par le roi blanc."}]},

          /* ================= LES FINALES ================= */
          {id:'opposition',mod:'Les finales',t:'Roi et pion : l’opposition',fen:'4k3/8/4K3/4P3/8/8/8/8 w - - 0 1',
          intro:`<p>Deux rois face à face avec une case vide entre eux sont en <b>opposition</b>. En finale, le roi est une pièce d'attaque : il doit marcher devant son pion.</p>`,
          steps:[
          {m:'e6d6',s:"Le roi blanc se place à côté, en contrôlant les cases devant le pion."},
          {m:'e8d8',s:"Le roi noir prend l'opposition."},
          {q:'e5e6',p:"À vous : avancez le pion, le roi le protège.",s:"Le pion avance sous la protection du roi."},
          {m:'d8e8',s:""},
          {q:'e6e7',p:"Encore une poussée !",s:"Le roi noir doit quitter la case de promotion."},
          {m:'e8f7',s:""},
          {m:'d6d7',s:"Le roi blanc contrôle la case e8."},
          {m:'f7f6',s:""},
          {q:'e7e8q',p:"Promouvez le pion en dame !",s:"Une nouvelle dame ! Règle : quand votre roi est devant le pion, sur la 6e rangée, c'est gagné."}]},
          {id:'carre',mod:'Les finales',t:'La règle du carré',fen:'8/8/8/8/P7/8/5k2/K7 w - - 0 1',
          intro:`<p>Tracez un carré du pion jusqu'à la 8e rangée : a4, a8, e8, e4. Si le roi adverse ne peut pas entrer dans ce carré, il ne rattrapera <b>jamais</b> le pion.</p>`,h:['a4','a8','e8','e4'],
          steps:[
          {m:'a4a5',s:"Le carré se réduit."},
          {m:'f2e3',s:"Le roi noir court…"},
          {m:'a5a6',s:""},{m:'e3d4',s:""},{m:'a6a7',s:""},
          {m:'d4c5',s:"Trop tard !"},
          {q:'a7a8q',p:"Promouvez !",s:"Le roi noir n'était pas dans le carré : le pion a gagné la course."}]},
