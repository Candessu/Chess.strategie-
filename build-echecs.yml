          {id:'f1',cat:'fin',t:'L’opposition',th:'Finale',fen:'4k3/8/4K3/4P3/8/8/8/8 w - - 0 1',sol:['e6d6','e6f6'],x:'Rd6 ou Rf6 ! Le roi se place à côté de son pion et garde le contrôle des cases devant lui.'},
          {id:'f2',cat:'fin',t:'Construire le pont',th:'Finale de tours',fen:'1K6/1P2k3/8/8/8/8/2r5/3R4 w - - 0 1',sol:['d1d4'],x:'Td4 ! La tour servira de bouclier contre les échecs : c’est la position de Lucena.'},
          {id:'f3',cat:'fin',t:'La course du pion',th:'Règle du carré',fen:'8/8/8/8/P7/8/5k2/K7 w - - 0 1',sol:['a4a5'],x:'a5 ! Le roi noir est hors du carré du pion : il ne le rattrapera jamais.'});
          PUZZLES.forEach(p=>{if(!p.cat)p.cat=PCAT[p.id]||'tac';});
          const MATECATS={mat1:1,mat2:1};
          const CATS=[
          {id:'mat',t:'Échec et mat',ic:'♚',d:'Mats types, mat en 1 et mat en 2',g:[
           {t:'Les mats types',l:['couloir','etouffe','escalier','dameroi','legal']},{t:'Mat en 1',p:'mat1'},{t:'Mat en 2',p:'mat2'}]},
          {id:'pieges',t:'Pièges dans les débuts',ic:'⚠',d:'Gagner vite, et ne jamais tomber dedans',g:[
           {t:'Pièges avec les Blancs',l:['berger','legal','foiefrit','carokannpiege']},{t:'Pièges avec les Noirs',l:['sot','blackburne','elephant','englund','noe','lasker']}]},
          {id:'debut',t:'Début',ic:'♟',d:'Les principes et les grandes ouvertures',g:[
           {t:'Les principes',l:['valeurs','centre','dev','roque','dame','methode']},{t:'Ouvertures ouvertes (1.e4 e5)',l:['italienne','espagnole']},
           {t:'Défenses contre 1.e4',l:['sicilienne','francaise','carokann','scandinave']},{t:'Ouvertures fermées (1.d4, 1.c4)',l:['gambitdame','londres','indienneroi','anglaise']}]},
          {id:'milieu',t:'Milieu de jeu',ic:'♛',d:'Stratégies d’attaque, jeu positionnel, tactique',g:[
           {t:'Stratégies d’attaque',l:['grec','roquesopp']},{t:'Stratégies positionnelles',l:['avantposte','colonnes','majorite','isole','minorite','fous','prophylaxie','plan']},
           {t:'Les motifs tactiques',l:['fourchette','fourchettepion','clouage','enfilade','decouverte','doubleechec','eliminer','doubleattaque']},{t:'Exercices tactiques',p:'tac'},{t:'Partie célèbre',l:['morphy']}]},
          {id:'finale',t:'Finale',ic:'♙',d:'Roi et pions, finales de tours',g:[
           {t:'Finales de pions',l:['opposition','carre']},{t:'Finales de tours',l:['lucena','philidor']},{t:'Exercices de finale',p:'fin'}]}];
          const LBY={};LESSONS.forEach(l=>LBY[l.id]=l);
          function catLessons(c){return[...new Set(c.g.flatMap(g=>g.l||[]))];}
          function catPuzzles(c){return c.g.filter(g=>g.p).flatMap(g=>PUZZLES.filter(p=>p.cat===g.p));}
          const TIPS=['Avant chaque coup : échecs, prises, menaces.','Cavaliers avant les fous, et roquez tôt.','Une pièce mal placée ? Améliorez-la avant d’attaquer.','Avec de l’avance matérielle, échangez les pièces, pas les pions.','Les pions passés doivent avancer.','Placez les tours sur les colonnes ouvertes.','En finale, le roi est une pièce d’attaque : centralisez-le.','Demandez-vous toujours : que menace l’adversaire ?','Ne prenez pas un pion « gratuit » sans vérifier le piège.','Après votre coup, une pièce reste-t-elle sans défense ?','Ne bougez pas les pions f et g devant votre roi en début de partie.','Contre une dame en h5 tôt, pensez à g6 ou dame e7.'];

          /* ---------- Navigation et tiroir ---------- */
          const DRAWER=[
           {h:'Entraînement'},
           ...CATS.map(c=>({v:'cat',id:c.id,t:c.t,ic:c.ic})),
           {v:'progres',t:'Progrès',ic:'↗'},{v:'erreurs',t:'Erreurs / Conseils',ic:'✎'},{v:'favoris',t:'Favoris',ic:'★'},
           {h:'Défi'},
           {v:'play',t:'Échiquier',ic:'▦'},{v:'defi',t:'Défi',ic:'⏱'},{v:'stats',t:'Statistiques',ic:'∿'},
           {h:'Information'},{v:'info',t:'À propos et réglages',ic:'ℹ'}];
          let route={v:'home'},stack=[],LP=null,DF=null;
          function key(r){return r.v+(r.id||'');}
          function openDrawer(o){document.body.classList.toggle('dopen',o);}
          function renderDrawer(){$('dlist').innerHTML=txt(DRAWER.map(d=>d.h?'<div class="dh">'+d.h+'</div>':'<button class="di'+(key(route)===key(d)?' on':'')+'" data-v="'+d.v+'" data-id="'+(d.id||'')+'"><span class="dic">'+d.ic+'</span>'+d.t+'</button>').join(''));}
          $('dlist').onclick=e=>{const b=e.target.closest('.di');if(!b)return;openDrawer(false);goRoot({v:b.dataset.v,id:b.dataset.id||undefined});};
          $('scrim').onclick=()=>openDrawer(false);
          $('dhome').onclick=()=>{openDrawer(false);goRoot({v:'home'});};
          function goRoot(r){route=r;stack=[];show();}
          function push(v){stack.push(v);show();}
          function show(){stopSpeak();if(LP)LP.auto=false;LP=null;if(DF){clearInterval(DF.timer);DF=null;}
           const v=stack.length?stack[stack.length-1]:route;$('bk').style.display=stack.length?'block':'none';$('mn').style.display=stack.length?'none':'block';
           renderDrawer();BOARDS.length=0;window.scrollTo(0,0);
           ({home:vHome,cat:vCat,lesson:vLesson,puzzle:vPuzzle,progres:vProgres,erreurs:vErreurs,gaffe:vGaffe,favoris:vFavoris,play:vPlay,defi:vDefi,stats:vStats,info:vInfo})[v.v](v);}
          $('mn').onclick=()=>openDrawer(true);
          $('bk').onclick=()=>window.handleBack();
          window.handleBack=function(){if(document.body.classList.contains('dopen')){openDrawer(false);return true;}const p=$('promo');if(p){p.remove();return true;}
           if(stack.length){stack.pop();show();return true;}if(route.v!=='home'){goRoot({v:'home'});return true;}return false;};
          function title(t){$('ttl').textContent=t;}
          function cnt(o){return Object.keys(o).filter(k=>o[k]).length;}
          function favBtn(k){return '<button class="fav'+(ST.fav[k]?' on':'')+'" id="fv" data-k="'+k+'">'+(ST.fav[k]?'★':'☆')+'</button>';}
          function bindFav(){const b=$('fv');if(b)b.onclick=()=>{const k=b.dataset.k;ST.fav[k]=!ST.fav[k];if(!ST.fav[k])delete ST.fav[k];save();b.classList.toggle('on',!!ST.fav[k]);b.textContent=ST.fav[k]?'★':'☆';};}
          function audioBtn(){return '<button class="abtn" id="aud">'+(ST.audio?'🔊':'🔇')+'</button>';}
          function bindAudio(){const b=$('aud');if(b)b.onclick=()=>{ST.audio=!ST.audio;save();b.textContent=ST.audio?'🔊':'🔇';if(!ST.audio)stopSpeak();};}
          function lessonItem(id,k,list){const l=LBY[id];const d=ST.l[id];return '<div class="it" data-l="'+id+'" data-list="'+list.join(',')+'"><span class="ic '+(d?'done':'')+'">'+(d?'✓':k+1)+'</span><span class="itx"><b>'+l.t+'</b><small>'+l.steps.filter(x=>x.m||x.q).length+' coups · '+l.steps.filter(x=>x.q).length+' question(s)</small></span>'+(ST.fav['l:'+id]?'<span class="st">★</span>':'')+'</div>';}
          function puzzleItem(p,k,list){const d=ST.p[p.id];return '<div class="it" data-p="'+p.id+'" data-list="'+list.join(',')+'"><span class="ic '+(d?'done':'')+'">'+(d?'✓':k+1)+'</span><span class="itx"><b>'+p.t+'</b><small>'+p.th+'</small></span>'+(ST.fav['p:'+p.id]?'<span class="st">★</span>':'')+'</div>';}
          function bindItems(root){root.querySelectorAll('.it').forEach(e=>e.onclick=()=>{const list=(e.dataset.list||'').split(',').filter(Boolean);
           if(e.dataset.l)push({v:'lesson',id:e.dataset.l,list});else if(e.dataset.p)push({v:'puzzle',id:e.dataset.p,list});else if(e.dataset.g!==undefined)push({v:'gaffe',i:+e.dataset.g});});}
          function logo(){let sq='';for(let r=0;r<8;r++)for(let f=0;f<8;f++)if((r+f)%2)sq+='<rect x="'+(f*10)+'" y="'+(r*10)+'" width="10" height="10"/>';
           return '<svg viewBox="-12 -30 104 112" class="logo"><defs><clipPath id="cc"><circle cx="40" cy="40" r="38"/></clipPath></defs><circle cx="40" cy="40" r="40" fill="#111"/><g clip-path="url(#cc)"><rect width="80" height="80" fill="#fff"/><g fill="#111">'+sq+'</g></g><text x="40" y="-2" text-anchor="middle" font-size="34" fill="#111">♚&#xFE0E;</text></svg>';}

          /* ---------- Accueil ---------- */
          function progressOf(c){const ls=catLessons(c),ps=catPuzzles(c);const d=ls.filter(i=>ST.l[i]).length+ps.filter(p=>ST.p[p.id]).length;return{d,n:ls.length+ps.length};}
          function vHome(){title('Échecs Stratégie');
           const nextL=LESSONS.find(l=>!ST.l[l.id]);const tip=TIPS[new Date().getDate()%TIPS.length];
           $('main').innerHTML=txt(`<div class="hero">${logo()}<div><h2>Apprenez les échecs<br>coup par coup</h2><small>${LESSONS.length} leçons commentées · ${PUZZLES.length} exercices</small></div></div>
           ${nextL?`<div class="card"><small class="mut">Continuer</small><h2>${nextL.t}</h2><button class="btn" id="hL" style="width:100%;margin-top:8px">▶ Reprendre l’apprentissage</button></div>`:''}
           <div class="rows">${CATS.map(c=>{const p=progressOf(c);return `<div class="crow" data-c="${c.id}"><span class="cic">${c.ic}</span><span class="ctx"><b>${c.t}</b><small>${c.d}</small><span class="bar"><i style="width:${p.d/p.n*100}%"></i></span></span><span class="chev">›</span></div>`;}).join('')}</div>
           <div class="row" style="margin-top:12px"><button class="btn sec" id="hD">⏱ Défi</button><button class="btn sec" id="hG">▦ Échiquier</button></div>
           <div class="card tip" style="margin-top:12px"><h2>💡 Conseil du jour</h2>${tip}</div>`);
           if($('hL'))$('hL').onclick=()=>{const c=CATS.find(c=>catLessons(c).includes(nextL.id));const g=c&&c.g.find(g=>g.l&&g.l.includes(nextL.id));push({v:'lesson',id:nextL.id,list:g?g.l:[nextL.id]});};
           document.querySelectorAll('.crow').forEach(e=>e.onclick=()=>goRoot({v:'cat',id:e.dataset.c}));
           $('hD').onclick=()=>goRoot({v:'defi'});$('hG').onclick=()=>goRoot({v:'play'});}

          /* ---------- Catégorie (accordéon) ---------- */
          const OPEN={};
          function vCat(v){const c=CATS.find(x=>x.id===v.id);title(c.t);
           if(OPEN[c.id]===undefined)OPEN[c.id]={0:true};
           $('main').innerHTML=txt(`<div class="mut" style="margin:0 2px 10px">${c.d}</div>`+c.g.map((g,gi)=>{
            const items=g.l?g.l.map((id,k)=>lessonItem(id,k,g.l)).join(''):PUZZLES.filter(p=>p.cat===g.p).map((p,k,a)=>puzzleItem(p,k,a.map(x=>x.id))).join('');
            const n=g.l?g.l.length:PUZZLES.filter(p=>p.cat===g.p).length,d=g.l?g.l.filter(i=>ST.l[i]).length:PUZZLES.filter(p=>p.cat===g.p&&ST.p[p.id]).length;
            return `<div class="acc${OPEN[c.id][gi]?' open':''}" data-gi="${gi}"><div class="ah"><span class="atx"><b>${g.t}</b><small>${g.p?'🧩 Exercices':'📖 Leçons'} · ${d} / ${n}</small></span><span class="achev">⌄</span></div><div class="ab">${items}</div></div>`;}).join(''));
           document.querySelectorAll('.ah').forEach(h=>h.onclick=()=>{const a=h.parentNode,gi=a.dataset.gi;a.classList.toggle('open');OPEN[c.id][gi]=a.classList.contains('open');});
           bindItems($('main'));}

          /* ---------- Leçon coup par coup ---------- */
          function buildLesson(l){let s=parseFEN(l.fen||START);for(const u of(l.pre||[]))s=make(s,legal(s).find(z=>uci(z)===u));
           const st=[s],mv=[null],sn=[''],wd=[''];
           l.steps.forEach(x=>{const p=st[st.length-1],u=x.m||x.q;if(!u){st.push(p);mv.push(null);sn.push('');wd.push('');return;}
            const m=legal(p).find(z=>uci(z)===u);sn.push((p.t==='w'?p.n+'. ':p.n+'… ')+san(p,m));wd.push(moveWords(p,m));mv.push(m);st.push(make(p,m));});
           return{st,mv,sn,wd};}
          function qMatch(q,u){return q.length===5&&q[4]!=='q'?u===q:u.slice(0,4)===q.slice(0,4);}
          function vLesson(v){const l=LBY[v.id],list=v.list&&v.list.length?v.list:[v.id],idx=list.indexOf(v.id);title(l.t);const D=buildLesson(l),N=l.steps.length;
           const qs=l.steps.map((x,k)=>x.q?k:-1).filter(k=>k>=0);const flip=qs.length>0&&qs.every(k=>D.st[k].t==='b');
           const P={k:0,solved:{},tries:0,fb:null,auto:false};LP=P;
           $('main').innerHTML=`<div class="lhead"><div class="bar" style="flex:1;margin:0"><i id="lpb"></i></div><span class="mut" id="lpn"></span>${favBtn('l:'+l.id)}${audioBtn()}</div>
           <div id="lb"></div>
           <div class="ctl"><button id="c0">⏮</button><button id="c1">◀</button><button id="c2">⏯</button><button id="c3" class="nx">▶</button></div>
           <div class="card lesson" id="lt"></div>`;
           bindAudio();bindFav();
           const B=Board($('lb'));B.flip=flip;
           const cur=()=>P.k>0?l.steps[P.k-1]:null;
           const quizOpen=()=>{const x=cur();return x&&x.q&&!P.solved[P.k];};
           function render(doSpeak){const x=cur();let say='',html='';
            if(P.k===0){B.arrows=l.a||[];B.hl=(l.h||[]).map(sqIdx);B.allow=null;B.onMove=null;B.set(D.st[0]);
             html='<h2>'+l.t+'</h2>'+l.intro+'<div class="mut" style="margin-top:8px">👆 Touchez une pièce pour voir ses coups possibles. ▶ pour avancer, ⏯ pour la lecture automatique.</div>';say=l.t+'. '+l.intro;}
            else if(quizOpen()){B.arrows=P.tries>=2?['y:'+x.q.slice(0,4)]:[];B.hl=[];B.allow=D.st[P.k-1].t;B.onMove=onMove;B.set(D.st[P.k-1],D.mv[P.k-1]);
             html='<div class="quiz">🎯 <b>À vous de jouer</b> ('+(D.st[P.k-1].t==='w'?'Blancs':'Noirs')+')<br>'+x.p+'</div>'+(P.fb?'<div class="msg '+P.fb.c+'">'+P.fb.t+'</div>':'')+'<div class="row" style="margin-top:8px"><button class="btn sec sm" id="rv">💡 Voir la réponse</button></div>';say=x.p;}
            else{B.arrows=x.a||[];B.hl=(x.h||[]).map(sqIdx);B.allow=null;B.onMove=null;B.set(D.st[P.k],D.mv[P.k]||null);
             html=(D.sn[P.k]?'<div class="mvh">'+D.sn[P.k]+'</div>':'')+(P.fb&&x.q?'<div class="msg '+P.fb.c+'">'+P.fb.t+'</div>':'')+(x.s?'<p>'+x.s+'</p>':'');
             say=(D.wd[P.k]||'')+' '+(P.fb&&x.q&&P.fb.c==='ok'?'Bravo ! ':'')+(x.s||'');
             if(P.k===N){ST.l[l.id]=true;save();html+='<div class="msg ok">🏆 Leçon terminée !</div><div class="row">'+(list[idx+1]?'<button class="btn" id="nxl">Leçon suivante →</button>':'')+'<button class="btn sec" id="rpl">↺ Revoir</button></div>';}}
            $('lt').innerHTML=txt(html);$('lpb').style.width=(P.k/N*100)+'%';$('lpn').textContent=P.k+' / '+N;$('c2').classList.toggle('on',P.auto);
            if($('rv'))$('rv').onclick=()=>{P.solved[P.k]=true;P.fb={c:'info',t:'💡 La réponse était : <b>'+D.sn[P.k]+'</b>'};render(true);};
            if($('nxl'))$('nxl').onclick=()=>{stack[stack.length-1]={v:'lesson',id:list[idx+1],list};show();};
            if($('rpl'))$('rpl').onclick=()=>{P.k=0;P.solved={};P.fb=null;render(true);};
            if(doSpeak)speak(say,()=>{if(LP===P&&P.auto){if(P.k<N&&!quizOpen())setTimeout(()=>{if(LP===P&&P.auto&&!quizOpen())step(1);},650);else{P.auto=false;$('c2').classList.remove('on');}}});}
           function step(d){if(d>0&&quizOpen()){P.solved[P.k]=true;P.fb={c:'info',t:'💡 La réponse était : <b>'+D.sn[P.k]+'</b>'};render(true);return;}
            const k=Math.max(0,Math.min(N,P.k+d));if(k===P.k&&d!==0)return;P.k=k;P.tries=0;P.fb=null;render(true);}
           function onMove(m){const x=cur();if(!quizOpen())return;const u=uci(m);
            if(qMatch(x.q,u)){P.solved[P.k]=true;P.fb={c:'ok',t:'✅ Bravo !'};render(true);}
            else if(x.ok&&x.ok.includes(u)){P.solved[P.k]=true;P.fb={c:'ok',t:'✅ Bonne idée aussi ! Voyons la suite principale.'};render(true);}
            else{P.tries++;B.allow=null;B.set(make(D.st[P.k-1],m),m);P.fb={c:'no',t:'❌ Ce n’est pas le coup attendu. Réessayez !'+(P.tries>=2?' Suivez la flèche jaune.':'')};
             speak('Ce n’est pas le coup attendu. Réessayez.');setTimeout(()=>{if(LP===P)render(false);},1000);}}
           $('c0').onclick=()=>{P.auto=false;P.k=0;P.fb=null;render(true);};
           $('c1').onclick=()=>{P.auto=false;step(-1);};
           $('c3').onclick=()=>{P.auto=false;step(1);};
           $('c2').onclick=()=>{P.auto=!P.auto;if(P.auto){if(P.k>=N){P.k=0;P.solved={};}if(quizOpen()){P.auto=false;speak(cur().p);}else if(P.k===0)render(true);else step(1);}else stopSpeak();$('c2').classList.toggle('on',P.auto);};
           render(true);}

          /* ---------- Exercice (moteur commun) ---------- */
          function PuzzleRun(B,P,cb){const line=P.line||null;let s=parseFEN(P.fen),i=0;const me=s.t;
           B.flip=me==='b';B.allow=me;B.arrows=[];B.hl=[];B.set(s);
           const last=()=>line?i===line.length-1:true;
           B.onMove=m=>{const u=uci(m),n=make(s,m);
            const ok=line?(u.slice(0,4)===line[i].slice(0,4)||(last()&&MATECATS[P.cat]&&status(n)==='mate')):(P.sol.includes(u)||(MATECATS[P.cat]&&status(n)==='mate'));
            B.arrows=[];
            if(!ok){B.allow=null;B.set(n,m);cb.wrong&&cb.wrong(m);return;}
            const prev=s;s=n;B.set(s,m);i++;
            if(!line||i>=line.length){B.allow=null;cb.done&&cb.done(prev,m);return;}
            B.allow=null;cb.step&&cb.step();
            setTimeout(()=>{const r=legal(s).find(z=>uci(z)===line[i])||legal(s)[0];s=make(s,r);B.set(s,r);i++;B.allow=me;},600);};
           return{retry(){B.allow=me;B.set(s,null);},hint(){const u=line?line[i]:P.sol[0];B.arrows=['y:'+u.slice(0,4)];B.render();},
            reset(){s=parseFEN(P.fen);i=0;B.allow=me;B.arrows=[];B.set(s);}};}
          function vPuzzle(v){const list=v.list&&v.list.length?v.list:[v.id],k=list.indexOf(v.id),P=PUZZLES.find(p=>p.id===v.id);title(P.t);const s0=parseFEN(P.fen);
           $('main').innerHTML=`<div class="status"><span style="flex:1">${s0.t==='w'?'⚪ Les Blancs jouent':'⚫ Les Noirs jouent'} · ${P.th}</span>${favBtn('p:'+P.id)}</div>
           <div id="pb"></div><div id="pm"><div class="mut" style="margin-top:8px">👆 Touchez une pièce pour voir ses coups possibles.</div></div>
           <div class="row" style="margin-top:12px"><button class="btn sec" id="rs">↺</button><button class="btn sec" id="so">💡 Solution</button>${list[k+1]?'<button class="btn" id="nx">Suivant →</button>':''}</div>`;
           bindFav();let tried=false;const B=Board($('pb'));
           const R=PuzzleRun(B,P,{
            done:(prev,m)=>{if(!ST.p[P.id]){ST.stats.pa++;if(!tried)ST.stats.ps++;}ST.p[P.id]=true;delete ST.pfail[P.id];save();$('pm').innerHTML='<div class="msg ok">✅ <b>Bravo !</b> '+P.x+'</div>';speak('Bravo ! '+moveWords(prev,m));},
            step:()=>{$('pm').innerHTML='<div class="msg info">👍 Bien ! Continuez…</div>';},
            wrong:()=>{if(!tried&&!ST.p[P.id]){ST.stats.pf++;ST.pfail[P.id]=true;save();}tried=true;$('pm').innerHTML='<div class="msg no">❌ Ce n\'est pas le meilleur coup. Réessayez !</div>';speak('Ce n’est pas le meilleur coup. Réessayez.');setTimeout(()=>R.retry(),900);}});
           $('rs').onclick=()=>{R.reset();$('pm').innerHTML='';};
           $('so').onclick=()=>{tried=true;R.hint();$('pm').innerHTML='<div class="msg info">💡 '+P.x+'</div>';};
           if($('nx'))$('nx').onclick=()=>{stack[stack.length-1]={v:'puzzle',id:list[k+1],list};show();};}

          /* ---------- Défi chronométré ---------- */
          function vDefi(){title('⏱ Défi');
           $('main').innerHTML=txt(`<div class="card"><h2>Défi 3 minutes</h2><p>Résolvez un maximum d’exercices en 3 minutes. Une erreur fait passer à l’exercice suivant.</p>
           <div class="kpis"><div><b>${ST.stats.db}</b><small>Meilleur score</small></div><div><b>${ST.stats.dn}</b><small>Défis joués</small></div></div>
           <button class="btn" id="go" style="width:100%;margin-top:12px">▶ Commencer le défi</button></div>`);
           $('go').onclick=startDefi;}
          function startDefi(){const pool=PUZZLES.slice().sort(()=>Math.random()-.5);DF={t:180,score:0,err:0,i:0,pool,timer:null};
           $('main').innerHTML='<div class="dbar"><span id="dt">3:00</span><span>✅ <b id="ds">0</b></span><span>❌ <b id="de">0</b></span></div><div id="db"></div><div id="dm"></div><button class="btn sec" id="dq" style="width:100%;margin-top:10px">Arrêter</button>';
           const B=Board($('db'));const D=DF;
           function next(){if(DF!==D)return;const P=D.pool[D.i++%D.pool.length];$('dm').innerHTML=txt('<div class="msg info">'+P.th+' · '+P.t+' — '+(parseFEN(P.fen).t==='w'?'les Blancs jouent':'les Noirs jouent')+'</div>');
            PuzzleRun(B,P,{done:()=>{D.score++;$('ds').textContent=D.score;setTimeout(next,500);},wrong:()=>{D.err++;$('de').textContent=D.err;setTimeout(next,700);}});}
           D.timer=setInterval(()=>{D.t--;$('dt').textContent=Math.floor(D.t/60)+':'+String(D.t%60).padStart(2,'0');if(D.t<=0)endDefi();},1000);
           $('dq').onclick=endDefi;next();}
          function endDefi(){const D=DF;if(!D)return;clearInterval(D.timer);DF=null;ST.stats.dn++;const rec=D.score>ST.stats.db;if(rec)ST.stats.db=D.score;save();
           $('main').innerHTML=txt(`<div class="card" style="text-align:center"><h2>Défi terminé !</h2><div class="big">${D.score}</div><div class="mut">exercices réussis · ${D.err} erreur(s)</div>${rec?'<div class="msg ok">🏆 Nouveau record !</div>':''}<button class="btn" id="go" style="width:100%;margin-top:12px">↺ Rejouer</button></div>`);
           speak('Défi terminé. Score : '+D.score+(rec?'. Nouveau record !':''));$('go').onclick=startDefi;}

          /* ---------- Progrès ---------- */
          function level(p){return p<.15?'Débutant':p<.4?'Apprenti':p<.7?'Intermédiaire':p<.95?'Avancé':'Expert';}
          function vProgres(){title('↗ Progrès');let D=0,Nn=0;const rows=CATS.map(c=>{const p=progressOf(c);D+=p.d;Nn+=p.n;const ls=catLessons(c),ps=catPuzzles(c);
            return `<div class="card"><h2>${c.ic} ${c.t}</h2><div class="bar"><i style="width:${p.d/p.n*100}%"></i></div><div class="mut">📖 ${ls.filter(i=>ST.l[i]).length} / ${ls.length} leçons${ps.length?' · 🧩 '+ps.filter(x=>ST.p[x.id]).length+' / '+ps.length+' exercices':''}</div></div>`;}).join('');
           const r=Nn?D/Nn:0;
           $('main').innerHTML=txt(`<div class="card" style="text-align:center"><div class="big">${Math.round(r*100)} %</div><div class="mut">de l’entraînement terminé</div><div class="lvl">Niveau : <b>${level(r)}</b></div></div>`+rows);}

          /* ---------- Erreurs / Conseils ---------- */
          function vErreurs(){title('✎ Erreurs / Conseils');const pf=PUZZLES.filter(p=>ST.pfail[p.id]&&!ST.p[p.id]);
           $('main').innerHTML=txt(`<div class="sh">🧩 Exercices à revoir</div>${pf.length?pf.map((p,k)=>puzzleItem(p,k,pf.map(x=>x.id))).join(''):'<div class="mut pad">Aucun exercice raté pour l’instant.</div>'}
           <div class="sh">♟ Vos gaffes en partie</div>${ST.err.length?ST.err.map((e,i)=>'<div class="it" data-g="'+i+'"><span class="ic '+(e.ok?'done':'')+'">'+(e.ok?'✓':'!')+'</span><span class="itx"><b>Vous avez joué '+e.pl+'</b><small>Retrouvez le meilleur coup</small></span></div>').join(''):'<div class="mut pad">L’entraîneur notera ici vos gaffes contre l’ordinateur.</div>'}
           <div class="sh">💡 Conseils</div><div class="card">${TIPS.map(t=>'<p>• '+t+'</p>').join('')}</div>`);
           bindItems($('main'));}
          function vGaffe(v){const e=ST.err[v.i];if(!e){stack.pop();show();return;}title('Votre gaffe');const s=parseFEN(e.fen);
           $('main').innerHTML=`<div class="status">${s.t==='w'?'⚪ Les Blancs jouent':'⚫ Les Noirs jouent'}</div><div id="gbb"></div><div id="gm"><div class="msg info">Dans la partie, vous avez joué <b>${e.pl}</b>. Trouvez mieux !</div></div><div class="row" style="margin-top:10px"><button class="btn sec" id="gs">💡 Solution</button></div>`;
           const B=Board($('gbb'));B.flip=s.t==='b';B.allow=s.t;B.set(s);
           B.onMove=m=>{let sc;try{sc=rootScores(s,2);}catch(x){return;}const best=Math.max(...sc.map(z=>z.v));const me=sc.find(z=>uci(z.m)===uci(m));B.set(make(s,m),m);
            if(me&&me.v>=best-40){e.ok=1;save();B.allow=null;$('gm').innerHTML='<div class="msg ok">✅ Bravo ! '+(uci(m)===e.b?'C’est le meilleur coup.':'Très bon coup aussi. Le meilleur était '+e.bs+'.')+'</div>';speak('Bravo !');}
            else{B.allow=null;$('gm').innerHTML='<div class="msg no">❌ Pas encore. Réessayez !</div>';setTimeout(()=>{B.allow=s.t;B.set(s);},900);}};
           $('gs').onclick=()=>{B.arrows=['y:'+e.b.slice(0,4)];B.render();$('gm').innerHTML='<div class="msg info">💡 Le meilleur coup était <b>'+e.bs+'</b>.</div>';};}

          /* ---------- Favoris ---------- */
          function vFavoris(){title('★ Favoris');const ls=Object.keys(ST.fav).filter(k=>k.startsWith('l:')).map(k=>k.slice(2)).filter(id=>LBY[id]);
           const ps=Object.keys(ST.fav).filter(k=>k.startsWith('p:')).map(k=>PUZZLES.find(p=>p.id===k.slice(2))).filter(Boolean);
           $('main').innerHTML=txt((ls.length||ps.length)?(ls.length?'<div class="sh">📖 Leçons</div>'+ls.map((id,k)=>lessonItem(id,k,ls)).join(''):'')+(ps.length?'<div class="sh">🧩 Exercices</div>'+ps.map((p,k)=>puzzleItem(p,k,ps.map(x=>x.id))).join(''):'')
            :'<div class="card"><h2>Aucun favori</h2><p>Touchez l’étoile ☆ en haut d’une leçon ou d’un exercice pour le retrouver ici.</p></div>');
           bindItems($('main'));}

          /* ---------- Statistiques ---------- */
          function vStats(){title('∿ Statistiques');const s=ST.stats,g=s.gw+s.gl+s.gd,pt=s.ps+s.pf;
           $('main').innerHTML=txt(`<div class="sh">🧩 Exercices</div><div class="kpis"><div><b>${cnt(ST.p)}</b><small>Résolus</small></div><div><b>${pt?Math.round(s.ps/pt*100)+' %':'–'}</b><small>Réussis du 1er coup</small></div><div><b>${Object.keys(ST.pfail).filter(id=>!ST.p[id]).length}</b><small>À revoir</small></div></div>
           <div class="sh">📖 Leçons</div><div class="kpis"><div><b>${cnt(ST.l)}</b><small>Terminées</small></div><div><b>${LESSONS.length}</b><small>Au total</small></div><div><b>${cnt(ST.fav)}</b><small>Favoris</small></div></div>
           <div class="sh">♟ Parties contre l’ordinateur</div><div class="kpis"><div><b>${s.gw}</b><small>Victoires</small></div><div><b>${s.gd}</b><small>Nulles</small></div><div><b>${s.gl}</b><small>Défaites</small></div></div>
           ${g?'<div class="card"><div class="wdl"><i style="flex:'+s.gw+';background:var(--ok)"></i><i style="flex:'+s.gd+';background:#9a8a77"></i><i style="flex:'+s.gl+';background:var(--bad)"></i></div></div>':''}
           <div class="sh">⏱ Défi</div><div class="kpis"><div><b>${s.db}</b><small>Meilleur score</small></div><div><b>${s.dn}</b><small>Défis joués</small></div><div><b>${ST.err.length}</b><small>Gaffes notées</small></div></div>`);}

          /* ---------- Information ---------- */
          function vInfo(){title('ℹ Information');const noVoice=window.AndroidTTS&&!ttsReady();
           $('main').innerHTML=txt(`<div class="card"><h2>🔊 Voix française</h2><div class="mut">${noVoice?'La voix française n’est pas encore prête sur ce téléphone.':'Les leçons, les exercices et l’entraîneur parlent en français.'}</div>
           <div class="row" style="margin-top:10px"><button class="btn sec" id="iA">${ST.audio?'🔊 Activée':'🔇 Désactivée'}</button><button class="btn sec" id="iT">Tester</button>${window.AndroidTTS?'<button class="btn sec" id="iI">Installer la voix</button>':''}</div></div>
           <div class="card"><h2>Comment utiliser l’application</h2><p>• <b>Leçons</b> : avancez avec ▶, ou lancez la lecture automatique avec ⏯. Les flèches vertes montrent les idées, les rouges les menaces, les bleues les plans.</p><p>• <b>À vous de jouer</b> : trouvez le coup demandé. Après deux erreurs, une flèche jaune vous aide.</p><p>• Touchez n’importe quelle pièce pour voir ses <b>coups possibles</b>.</p><p>• <b>Échiquier</b> : jouez contre l’ordinateur, l’entraîneur note vos gaffes dans « Erreurs / Conseils ».</p></div>
           <div class="card"><h2>Réinitialiser</h2><p class="mut">Efface toute votre progression, vos statistiques et vos favoris.</p><button class="btn sec" id="iR">Tout effacer</button></div>
           <div class="mut" style="text-align:center;margin:16px 0">Échecs Stratégie · version 3.0</div>`);
           $('iA').onclick=()=>{ST.audio=!ST.audio;save();if(!ST.audio)stopSpeak();vInfo();};
           $('iT').onclick=()=>{if(!ST.audio){ST.audio=true;save();vInfo();}speak('Bonjour ! Je vais commenter chaque coup de vos leçons d’échecs.');};
           if($('iI'))$('iI').onclick=()=>{try{AndroidTTS.install();}catch(e){}};
           $('iR').onclick=()=>{const b=$('iR');if(b.dataset.c){ST.l={};ST.p={};ST.pfail={};ST.fav={};ST.err=[];ST.game=null;ST.stats={pa:0,ps:0,pf:0,gw:0,gl:0,gd:0,db:0,dn:0};save();G.hist=[];goRoot({v:'home'});}else{b.dataset.c=1;b.textContent='Confirmer : tout effacer';}};}

          /* ---------- Jouer ---------- */
          const LEVELS=[{n:'Débutant',depth:1,time:400,noise:250},{n:'Facile',depth:2,time:800,noise:60},{n:'Moyen',depth:3,time:1500,noise:15},{n:'Fort',depth:5,time:3000,noise:0}];
          const G={hist:[],moves:[],sans:[],last:null,msg:null,thinking:false,over:null,hint:[]};
          function loadGame(){G.hist=[parseFEN(START)];G.moves=[];G.sans=[];G.last=null;G.msg=null;G.over=null;G.hint=[];
           if(ST.game&&ST.game.moves){for(const u of ST.game.moves){const s=cur();const m=legal(s).find(z=>uci(z)===u);if(!m)break;pushMove(m,true);}}
           G.over=status(cur());}
          function cur(){return G.hist[G.hist.length-1];}
          function pushMove(m,quiet){const s=cur();G.sans.push(san(s,m));G.hist.push(make(s,m));G.moves.push(uci(m));G.last=m;G.hint=[];if(!quiet){ST.game={moves:G.moves.slice(),rec:ST.game&&ST.game.rec&&G.over?1:0};save();}}
          const SET=ST.set;
          function aiTurn(){return SET.mode==='ai'&&!G.over&&cur().t!==SET.color;}
          let PB=null;
          function vPlay(){title('▦ Échiquier');
           if(!G.hist.length)loadGame();
           if(!ST.game){vSetup();return;}
           $('main').innerHTML=`<div class="status" id="st"></div><div id="gb"></div><div id="cm"></div><div class="moves" id="mv"></div>
           <div class="row"><button class="btn sec sm" id="un">↶ Annuler</button><button class="btn sec sm" id="hi">💡 Indice</button><button class="btn sec sm" id="fl">⇅ Tourner</button><button class="btn sm" id="ng">Nouvelle</button></div>`;
           PB=Board($('gb'));PB.flip=SET.mode==='ai'&&SET.color==='b';
           PB.onMove=m=>{const prev=cur();pushMove(m);G.msg=null;updPlay();G.over=status(cur());
            setTimeout(()=>{if(SET.coach&&SET.mode==='ai'){coach(prev,m);coachSay();}G.over=status(cur());updPlay();if(aiTurn())aiMove();},30);};
           $('un').onclick=()=>{if(G.thinking||G.moves.length===0)return;let k=SET.mode==='ai'?(cur().t===SET.color?2:1):1;k=Math.min(k,G.moves.length);
            const ms=G.moves.slice(0,G.moves.length-k);ST.game={moves:ms};save();loadGame();updPlay();if(aiTurn())aiMove();};
           $('hi').onclick=()=>{if(G.thinking||G.over||aiTurn())return;G.thinking=true;updPlay();setTimeout(()=>{const m=think(cur(),{depth:4,time:1500,noise:0});G.thinking=false;if(m){G.hint=[m.f,m.t];G.msg={c:'warn',t:'💡 Indice : essayez <b>'+san(cur(),m)+'</b>.'};speak('Indice : '+moveWords(cur(),m));}updPlay();},40);};
           $('fl').onclick=()=>{PB.flip=!PB.flip;PB.render();};
           $('ng').onclick=()=>{if(G.thinking)return;ST.game=null;save();vSetup();};
           updPlay();if(aiTurn()&&!G.thinking)aiMove();}
          function recResult(){if(!G.over||SET.mode!=='ai'||!ST.game||ST.game.rec)return;ST.game.rec=1;const s=cur();if(G.over==='mate'){if(s.t!==SET.color)ST.stats.gw++;else ST.stats.gl++;}else ST.stats.gd++;save();}
          function updPlay(){if(!PB||!document.body.contains(PB.el))return;const s=cur();recResult();
           PB.allow=(G.over||G.thinking)?null:(SET.mode==='ai'?SET.color:'both');PB.arrows=G.hint.length?['y:'+sqName(G.hint[0])+sqName(G.hint[1])]:[];PB.set(s,G.last);
           let st;if(G.over){st={mate:(s.t==='w'?'Les Noirs':'Les Blancs')+' gagnent par échec et mat ! 🏆',pat:'Pat : partie nulle.','50':'Nulle (règle des 50 coups).',mat:'Nulle : matériel insuffisant.'}[G.over];
            if(G.over==='mate'&&SET.mode==='ai')st=(s.t!==SET.color?'🏆 Victoire ! Échec et mat.':'Échec et mat… L\'ordinateur gagne. Rejouez !');}
           else if(G.thinking)st='<div class="spin"></div>'+(aiTurn()?'L\'ordinateur réfléchit…':'Analyse…');
           else st=(s.t==='w'?'⚪ Trait aux Blancs':'⚫ Trait aux Noirs')+(inCheck(s)?' — <span style="color:var(--bad)">Échec !</span>':'')+(SET.mode==='ai'?' · '+LEVELS[SET.level].n:'');
           $('st').innerHTML=st;
           $('cm').innerHTML=G.msg?'<div class="coach '+G.msg.c+'">'+G.msg.t+'</div>':'';
           let mv='';for(let i=0;i<G.sans.length;i++){if(i%2===0)mv+='<b>'+(i/2+1)+'.</b> ';mv+=G.sans[i]+' ';}
           $('mv').innerHTML=mv||'<span class="mut">Les coups joués apparaîtront ici.</span>';$('mv').scrollTop=9999;}
          function coachSay(){if(G.msg&&(G.msg.c==='bad'||G.msg.c==='warn'))speak(G.msg.t.replace(/<b>(.*?)<\/b>/,'$1'));}
          function aiMove(){G.thinking=true;updPlay();setTimeout(()=>{const m=think(cur(),LEVELS[SET.level]);G.thinking=false;if(m)pushMove(m);G.over=status(cur());updPlay();},60);}
          function coach(prev,m){const ms=legal(prev);if(ms.length<2)return;
           let sc;try{sc=rootScores(prev,2);}catch(e){return;}
           const cl=v=>Math.max(-3000,Math.min(3000,v));const best=sc.reduce((a,b)=>b.v>a.v?b:a);const me=sc.find(z=>uci(z.m)===uci(m));if(!me)return;
           const d=cl(best.v)-cl(me.v);const bs=san(prev,best.m,ms);
           if(uci(best.m)===uci(m)||d<=15)G.msg={c:'good',t:'✅ Bon coup ! C\'est ce que l\'entraîneur aurait joué.'};
           else if(d<80)G.msg={c:'good',t:'👍 Coup correct. '+bs+' était légèrement meilleur.'};
           else if(d<220)G.msg={c:'warn',t:'⚠️ Imprécision. Le meilleur coup était <b>'+bs+'</b>.'};
           else{G.msg={c:'bad',t:'❌ Gaffe ! Vous perdez du matériel ou de la position. Il fallait jouer <b>'+bs+'</b>. Pensez : échecs, prises, menaces.'};ST.err.unshift({fen:toFEN(prev),pl:san(prev,m,ms),b:uci(best.m),bs:bs});ST.err=ST.err.slice(0,30);save();}}
          function vSetup(){title('▦ Nouvelle partie');
           const seg=(id,opts,val)=>'<div class="seg" id="'+id+'">'+opts.map(o=>'<button data-v="'+o[0]+'" class="'+(String(o[0])===String(val)?'on':'')+'">'+o[1]+'</button>').join('')+'</div>';
           $('main').innerHTML=txt(`<div class="card"><h2>Adversaire</h2>${seg('sm',[['ai','Ordinateur'],['2p','2 joueurs']],SET.mode)}
           <div id="aiopt"><h2>Votre couleur</h2>${seg('sc',[['w','⚪ Blancs'],['b','⚫ Noirs'],['r','🎲 Hasard']],SET.color)}
           <h2>Niveau</h2>${seg('sl',LEVELS.map((l,i)=>[i,l.n]),SET.level)}
           <h2>Entraîneur</h2>${seg('sk',[['1','Activé'],['0','Désactivé']],SET.coach?'1':'0')}<div class="mut">L'entraîneur analyse chacun de vos coups et vous signale les gaffes.</div></div></div>
           <button class="btn" style="width:100%" id="go">Commencer la partie</button>`);
           let col=SET.color;
           const bind=(id,fn)=>$(id).onclick=e=>{const b=e.target.closest('button');if(!b)return;$(id).querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));fn(b.dataset.v);};
           bind('sm',v=>{SET.mode=v;$('aiopt').style.display=v==='ai'?'block':'none';});bind('sc',v=>col=v);bind('sl',v=>SET.level=+v);bind('sk',v=>SET.coach=v==='1');
           $('aiopt').style.display=SET.mode==='ai'?'block':'none';
           $('go').onclick=()=>{SET.color=col==='r'?(Math.random()<.5?'w':'b'):col;ST.game={moves:[]};save();G.hist=[];vPlay();};}


          $('dhome').innerHTML=logo();
          show();
          </script>
          </body>
          </html>
          EOF_10


      - name: Construire l'APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk EchecsStrategie.apk

      - name: Télécharger l'APK
        uses: actions/upload-artifact@v4
        with:
          name: EchecsStrategie-APK
          path: EchecsStrategie.apk
